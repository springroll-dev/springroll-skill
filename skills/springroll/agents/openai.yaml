interface:
  display_name: "SpringRoll"
  short_description: "Operate the full SpringRoll control plane"
  default_prompt: "Use $springroll to manage this application through SpringRoll MCP."

dependencies:
  tools:
    - type: "mcp"
      value: "springroll"
      description: "Production SpringRoll application control plane"
      transport: "streamable_http"
      url: "https://springroll.dev/api/mcp"
